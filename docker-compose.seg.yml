services:

  # ── Base de données PostgreSQL ─────────────────────────────
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-braincore_seg}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pg_data_seg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Django ─────────────────────────────────────────
  backend:
    build:
      context: ./backend_django
      args:
        USE_GPU: "false"
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      MEDIA_ROOT: /app/media
      CTIAMA_MODE: "false"
      CTIAMA_SERVICE_USER: "ctiama"
      APP_MODE: segmentation
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - media_seg:/app/media
      - ./backend_django/models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_ctiama_user &&
             daphne -b 0.0.0.0 -p 8000 backend_django.asgi:application"

  # ── Frontend React — build en mode Segmentation ───────────
  frontend:
    build:
      context: ./frontend
      args:
        APP_MODE: segmentation
        AUTH_DISABLED: "false"
        API_BASE_URL: /api
    ports:
      - "3001:80"
    volumes:
      - media_seg:/app/media:ro
    depends_on:
      - backend

volumes:
  pg_data_seg:
  media_seg:
